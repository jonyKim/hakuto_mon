name: Build and Deploy API

on:
  push:
    branches: [ main ]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'api/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lfit-admin-api
  REPO_OWNER: jonykim

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    defaults:
      run:
        working-directory: api
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create .env file
        run: |
          cat << EOF > .env
          # API Configuration
          NODE_ENV=production
          PORT=3001
          
          # Security
          MAX_LOGIN_ATTEMPTS=${{ secrets.MAX_LOGIN_ATTEMPTS || '5' }}
          LOCKOUT_TIME=${{ secrets.LOCKOUT_TIME || '30' }}
          COOKIE_SECRET=${{ secrets.COOKIE_SECRET }}
          COOKIE_NAME=auth-token
          
          # Supabase Configuration
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
          
          # JWT Configuration
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          
          # CORS
          ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS || 'http://localhost:3000' }}
          
          # RPC URLs
          ETH_RPC_URL=${{ secrets.ETH_RPC_URL }}
          BSC_RPC_URL=${{ secrets.BSC_RPC_URL || 'https://bsc-dataseed.binance.org/' }}
          BSC_TESTNET_RPC_URL=${{ secrets.BSC_TESTNET_RPC_URL || 'https://data-seed-prebsc-1-s1.binance.org:8545/' }}
          POLYGON_RPC_URL=${{ secrets.POLYGON_RPC_URL }}
          POLYGON_TESTNET_RPC_URL=${{ secrets.POLYGON_TESTNET_RPC_URL }}
          
          # Mobile API
          MOBILE_API_KEY=${{ secrets.MOBILE_API_KEY }}
          
          # Logging
          LOG_LEVEL=info
          EOF

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH Connection
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 ubuntu@${{ secrets.EC2_HOST }} 'echo "SSH connection successful"'

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Create project directory if it doesn't exist
            mkdir -p ~/project/lfit-admin-api
            
            # Create .env file
            cat << EOF > ~/project/lfit-admin-api/.env
            # API Configuration
            NODE_ENV=production
            PORT=3001
            
            # Security
            MAX_LOGIN_ATTEMPTS=${{ secrets.MAX_LOGIN_ATTEMPTS || '5' }}
            LOCKOUT_TIME=${{ secrets.LOCKOUT_TIME || '30' }}
            COOKIE_SECRET=${{ secrets.COOKIE_SECRET }}
            COOKIE_NAME=auth-token
            
            # Supabase Configuration
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
            
            # JWT Configuration
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            
            # CORS
            ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS || 'http://localhost:3000' }}
            
            # RPC URLs
            ETH_RPC_URL=${{ secrets.ETH_RPC_URL }}
            BSC_RPC_URL=${{ secrets.BSC_RPC_URL || 'https://bsc-dataseed.binance.org/' }}
            BSC_TESTNET_RPC_URL=${{ secrets.BSC_TESTNET_RPC_URL || 'https://data-seed-prebsc-1-s1.binance.org:8545/' }}
            POLYGON_RPC_URL=${{ secrets.POLYGON_RPC_URL }}
            POLYGON_TESTNET_RPC_URL=${{ secrets.POLYGON_TESTNET_RPC_URL }}
            
            # Mobile API
            MOBILE_API_KEY=${{ secrets.MOBILE_API_KEY }}
            
            # Logging
            LOG_LEVEL=info
            EOF
            
            # Create docker-compose.yml
            cat << EOF > ~/project/lfit-admin-api/docker-compose.yml
            version: '3.8'
            services:
              api:
                image: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/${{ env.IMAGE_NAME }}:latest
                ports:
                  - "3001:3001"
                env_file:
                  - .env
                restart: unless-stopped
            EOF
            
            # Pull latest image
            cd ~/project/lfit-admin-api
            docker pull ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/${{ env.IMAGE_NAME }}:latest
            
            # Stop and remove existing containers
            docker-compose down
            
            # Start the application
            docker-compose up -d 